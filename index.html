<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Denisa Millerová | People • Processes • Technology</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

</head>

<body class="login-page">

    <div id="background" aria-hidden="true"></div>

    <main class="login-main">

        <section
            class="login-box"
            aria-labelledby="login-heading"
        >

            <div
                class="logo-circle"
                aria-hidden="true"
            >
                DM
            </div>

            <p class="login-eyebrow">
                PEOPLE • PROCESSES • TECHNOLOGY
            </p>

            <h1 id="login-heading">
                Denisa Millerová
            </h1>

            <p class="login-description">
                Exploring People, Processes &amp; Technology.
                <br><br>
                Enter the access code to discover more.
            </p>

            <form
                class="login-form"
                onsubmit="checkCode(); return false;"
            >

                <label for="accessCode">
                    Access code
                </label>

                <input
                    type="password"
                    id="accessCode"
                    name="accessCode"
                    placeholder="Enter access code"
                    autocomplete="current-password"
                    required
                >

                <button type="submit">
                    Discover More
                </button>

            </form>

            <p
                id="message"
                class="login-message"
                aria-live="polite"
            ></p>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
